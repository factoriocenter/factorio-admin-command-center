[mod-setting-description]
facc-show-cheat-tab=Aktiviert den Reiter für Schummelwerkzeuge im Herstellungsmenü.
facc-internal-names=Überschreibt den lokalisierten Namen jedes Prototyps mit seiner internen Kennung und Details.
facc-enable-achievement-overrides=Wenn aktiviert, werden die eingebauten Einschränkungen für Errungenschaften umgangen.
facc-infinite-resources=Wenn aktiviert, werden alle Ressourcen wie in Satisfactory unendlich und erscheinen stets mit ihrer vollständigen normalen Menge.\n\n[font=default-bold][color=red]Warnung:[/color]\n[color=orange]Beim Aktivieren oder Deaktivieren dieser Option werden alle Ressourcen auf der Karte neu geladen und wiederhergestellt.[/color]\n[color=red]Auf großen Karten kann das erste Laden nach Änderung dieser Einstellung mehrere Minuten dauern. Warte einfach – das Spiel wird anschließend normal fortgesetzt. Um wiederholte lange Ladezeiten zu vermeiden, speichere das Spiel nach dem Aktivieren oder Deaktivieren dieser Option.[/color][/font]
facc-infinite-resources-multiplier-solid=Bestimmt den Multiplikator für unendliche Ressourcen in Feststoffkategorien (z. B. basic-solid, hard-solid und andere nicht flüssige Typen). Beeinflusst den Ressourcenreichtum und die Auffüllmengen.\n1× = 100%\n2× = 200%\n5× = 500%\n10× = 1000%\n20× = 2000%\n50× = 5000%
facc-infinite-resources-multiplier-fluid=Bestimmt den Multiplikator für unendliche Ressourcen in Flüssigkeitskategorien (z. B. basic-fluid und durch Mods hinzugefügte Flüssigkeitskategorien). Beeinflusst den Ressourcenreichtum und die Auffüllmengen. Mod-Kategorien werden als Flüssigkeit behandelt, wenn der Kategoriename "fluid" enthält oder die Ressource eine Flüssigkeit erzeugt.\n1× = 100%\n2× = 200%\n5× = 500%\n10× = 1000%\n20× = 2000%\n50× = 5000%
facc-enable-auto-resource-regeneration=Wenn aktiviert, werden endliche Ressourcen beim Umschalten der Einstellung "Unendliche Ressourcen" automatisch regeneriert (nach Aktivierung und anschließender Deaktivierung). Die manuelle Regeneration über die Schaltfläche "Ressourcen regenerieren" in der Admin-Oberfläche ist unabhängig davon immer verfügbar.\n[color=green]Karteneinstellung: Kein Neustart des Spiels erforderlich.[/color]\n[color=red][font=default-bold]Warnung:[/font][/color]\n[color=orange]Es wird nicht empfohlen, diese Einstellung gleichzeitig mit "Unendliche Ressourcen" zu aktivieren.[/color]\n[color=red]Für beste Ergebnisse verwende nur eine der beiden Optionen – niemals beide gleichzeitig.[/color]\n[color=green]Beide deaktiviert zu lassen ist ebenfalls sicher und wird unterstützt.[/color]
facc-instant-mining-drills=Multipliziert die Abbaugeschwindigkeit jedes Förderers um einen sehr hohen Faktor.
facc-instant-crafting-machines=Multipliziert die Herstellungsgeschwindigkeit, sodass Rezepte sofort abgeschlossen werden.
facc-remove-electricity-usage=Stellt unterstützte elektrische Entitäten auf leeren Energieverbrauch um, sodass sie ohne Stromnetz betrieben werden können.\n[color=yellow]Starteinstellung: Erfordert einen Neustart des Spiels.[/color]\n[color=orange]Gilt nur für Prototypen, die leere Energie über die API unterstützen.[/color]
facc-remove-fuel-usage=Stellt unterstützte Brennstoff-/Flüssigkeitsentitäten auf leeren Energieverbrauch um, sodass sie ohne Treibstoff betrieben werden können.\n[color=yellow]Starteinstellung: Erfordert einen Neustart des Spiels.[/color]\n[color=orange]Gilt nur für Prototypen, die leere Energie über die API unterstützen.[/color]
facc-infinite-ammo=Setzt den Munitionsverbrauch von Waffen und Geschütztürmen während der Datenphase auf Null.\n[color=yellow]Starteinstellung: Erfordert einen Neustart des Spiels.[/color]\n[color=orange]Betrifft Waffen des Spielers, Fahrzeugwaffen und Munitionsgeschütztürme.[/color]
facc-ignore-recipe-inputs=Entfernt die Zutatenanforderungen aller Rezepte, sodass Produkte ohne Verbrauch von Zutaten hergestellt werden.\n[color=yellow]Starteinstellung: Erfordert einen Neustart des Spiels.[/color]\n[color=orange]Wenn aktiviert, kann keine Rezeptqualität ausgewählt werden.[/color]\n[color=red]Betrifft alle Rezepte, einschließlich durch Mods hinzugefügter Rezepte.[/color]
facc-enable-background-optimization=[font=default-bold]Standard:[/font] AUS.\n[color=green]Karteneinstellung: Kein Neustart des Spiels erforderlich.[/color]\n\n[color=green][font=default-bold]AN (Optimierte Verarbeitung):[/font][/color]\nVerarbeitet aufwendige Aktionen im Hintergrund, um Einfrieren bei großen Spielständen zu vermeiden.\n[color=green]Vorteile:[/color] flüssigeres Spiel, sicherer für große Karten.\n[color=yellow]Nachteile:[/color] die vollständige Verarbeitung kann etwas länger dauern.\n\n[color=orange][font=default-bold]AUS (Sofortige Verarbeitung):[/font][/color]\nFührt alles sofort in einem Durchgang aus.\n[color=green]Vorteile:[/color] schnellste Verarbeitung bei kleinen Spielständen.\n[color=red]Nachteile:[/color] kann bei großen Spielständen zu Einfrieren/Ruckeln führen.
facc-stats-hud-enabled=Zeigt ein schlankes HUD mit aktuellen Spielstatistiken.
facc-stats-hud-single-line=Zeigt alle aktivierten HUD-Sensoren in einer horizontalen Zeile an. Deaktivieren für untereinander angeordnete Zeilen.
facc-stats-hud-adjust-for-fps-ups=Fügt Abstand hinzu, um das HUD an den Bereich der FPS/UPS-Anzeige anzupassen.
facc-stats-hud-adjust-for-clock=Fügt oben Abstand hinzu, um das HUD bei aktivierter Spieluhr auszurichten.
facc-stats-hud-show-research-eta=Zeigt die geschätzte verbleibende Zeit für die aktuelle Forschung Deiner Fraktion.
facc-stats-hud-show-coordinates=Zeigt deine aktuelle X- und Y-Position.
facc-stats-hud-show-distance-from-point=Zeigt die Entfernung von einem unten konfigurierten benutzerdefinierten Punkt.
facc-stats-hud-distance-origin-x=X-Koordinate des Referenzpunkts für die Entfernungsmessung.
facc-stats-hud-distance-origin-y=Y-Koordinate des Referenzpunkts für die Entfernungsmessung.
facc-stats-hud-show-evolution=Zeigt den aktuellen Evolutionsfaktor der Gegner auf Deiner Oberfläche.
facc-stats-hud-show-pollution=Zeigt die Verschmutzung an Deiner aktuellen Position.
facc-stats-hud-show-playtime=Zeigt die gesamte Spielzeit des Spielstands.
facc-stats-hud-show-playtime-days=Wenn aktiviert, wird die Spielzeit als Tage + Zeit angezeigt.
facc-stats-hud-show-daytime=Zeigt die aktuelle Oberflächenzeit und die Anzahl der Tage.
facc-stats-hud-show-movement-speed=Zeigt deine Bewegungsgeschwindigkeit (zu Fuß oder im Fahrzeug).
facc-stats-hud-show-player-max-speed=Zeigt zu Fuß zusätzlich die berechnete maximale Geschwindigkeit der Spielfigur.
facc-stats-hud-show-vehicle-max-speed=Zeigt im Fahrzeug zusätzlich die berechnete maximale Fahrzeuggeschwindigkeit.
facc-stats-hud-show-handcraft-timer=Zeigt die verbleibende Zeit der manuellen Herstellungswarteschlange.
facc-stats-hud-show-vehicle-fuel=Zeigt, sofern verfügbar, den geschätzten Treibstoff-/Energievorrat von Fahrzeugen und den Plattformtreibstoff.
facc-stats-hud-offset-preset-one-info=Voreingestellter vertikaler Versatz, wenn nur 1 Spielinfozeile oben rechts sichtbar ist (Versatz 22).
facc-stats-hud-offset-preset-two-infos=Voreingestellter vertikaler Versatz, wenn 2 Spielinfozeilen oben rechts sichtbar sind (Versatz 39).
facc-stats-hud-offset-preset-three-infos=Voreingestellter vertikaler Versatz, wenn 3 Spielinfozeilen oben rechts sichtbar sind (Versatz 60).

[item-group-name]
facc-cheat-tools=Schummelwerkzeuge

[item-subgroup-name]
facc-cheat-recipes=Rezepte für Schummelwerkzeuge
