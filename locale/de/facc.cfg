robot-battery-bonus=Passt den Batteriebonus Deiner Arbeitsroboter entsprechend dem Schieberegler an.
following-robot-lifetime-bonus=Passt den Lebensdauerbonus Deiner Begleitroboter entsprechend dem Schieberegler an.
maximum-following-robot-count=Passt die maximale Anzahl Deiner Begleitroboter entsprechend dem Schieberegler an.
inserter-stack-size-bonus=Passt den Stapelgrößenbonus Deiner Greifarme entsprechend dem Schieberegler an.
bulk-inserter-capacity-bonus=Passt den Kapazitätsbonus Deiner Massengreifarme entsprechend dem Schieberegler an.\n[color=orange]API-Limit: 0 bis 254.[/color]
belt-stack-size-bonus=Passt den Stapelgrößenbonus Deiner Fließbänder entsprechend dem Schieberegler an.
beacon-distribution-bonus=Passt den Verteilungsbonus Deiner Effektverteiler entsprechend dem Schieberegler an.
laboratory-speed-bonus=Passt den Geschwindigkeitsbonus Deiner Labore entsprechend dem Schieberegler an.
laboratory-productivity-bonus=Passt den Produktivitätsbonus Deiner Labore entsprechend dem Schieberegler an.
mining-drill-productivity-bonus=Passt den Produktivitätsbonus Deiner Förderer entsprechend dem Schieberegler an.
train-braking-force-bonus=Passt den Bremskraftbonus Deiner Züge entsprechend dem Schieberegler an.
gun-speed-boost=Wendet entsprechend dem Schieberegler einen Feuerratenbonus auf unterstützte Munitionskategorien an.
artillery-range-boost=Passt den Reichweitenbonus Deiner Artillerie entsprechend dem Schieberegler an.

long-reach=Erhöht die Bau-, Abbau- und Aufnahmereichweite Deiner Spielfigur.
build-distance=Passt den Bonus für die Baureichweite Deiner Fraktion an.
reach-distance=Passt den Bonus für die Interaktionsreichweite Deiner Fraktion an.
resource-reach-distance=Passt den Bonus für die Ressourcenreichweite Deiner Fraktion an.
item-drop-distance=Passt den Bonus für die Ablagereichweite von Gegenständen Deiner Fraktion an.
item-pickup-distance=Passt den Bonus für die Aufnahmereichweite von Gegenständen Deiner Fraktion an.
loot-pickup-distance=Passt den Bonus für die Aufnahmereichweite von Beute Deiner Fraktion an.
set-inventory-slots-bonus=Legt den Bonus für Inventarplätze Deiner Fraktion fest.\n[color=orange]Das Minimum beträgt 0 bzw. 10 nach Erforschung von [font=default-bold]Werkzeuggürtel[/font].[/color]

cheat-mode=Schaltet den Schummelmodus ein oder aus und ermöglicht das Erzeugen von Gegenständen ohne Rohstoffe/Zwischenprodukte.

toggle-editor=Wechselt zwischen Karteneditor und normalem Spielmodus.

console=Öffnet ein Fenster zum Eingeben und Ausführen von Lua-Befehlen während des Spiels.

unlock-recipes=Schaltet sofort alle Baupläne frei.

unlock-technologies=Schließt sofort den gesamten Forschungsbaum ab.

insert-coins=Fügt deinem Inventar 100.000 Münzen hinzu.\n[color=green]Nur in den Szenarien [font=default-bold]Engpass[/font] und [font=default-bold]Raketenansturm[/font] sinnvoll.[/color]

auto-instant-research=Führt automatisch in festgelegten Intervallen eine Schnellforschung durch.\n[color=orange]In Sekunden.[/color]

set-game-speed=Legt den globalen Spielgeschwindigkeitsmultiplikator entsprechend dem Schieberegler fest.

disable-friendly-fire=Verhindert, dass verbündete Kräfte einander Schaden zufügen.

indestructible-builds=Macht alle vorhandenen Entitäten auf der Oberfläche unzerstörbar.

peaceful-mode=Aktiviert den Friedensmodus und verhindert, dass Biter angreifen.\n[color=orange]Außer wenn sie provoziert werden.[/color]

ammo-turrets=Füllt Geschütztürme automatisch mit geeigneter Munition auf.

ammo-damage-boost=Wendet entsprechend dem Schieberegler einen Schadensbonus auf Munition an.

turret-damage-boost=Wendet entsprechend dem Schieberegler einen Angriffsbonus auf Geschütztürme an.

enemy-expansion=Schaltet die automatische Ausbreitung von Biter-Nestern ein oder aus.

remove-nests=Entfernt alle Biter-Nester innerhalb des eingestellten Radius.

always-day=Hält auf der Oberfläche dauerhaft den Tag aufrecht und deaktiviert den Nachtzyklus.
surface-freeze-daytime=Friert den Tag-Nacht-Zyklus der aktuellen Oberfläche bei der aktuellen Tageszeit ein.
surface-daytime=Stellt die Tageszeit der aktuellen Oberfläche mit Schieberegler und Anwenden-Schaltfläche auf einen Wert von 0,00 bis 1,00 ein.
surface-daytime-midday=Stellt die Tageszeit der aktuellen Oberfläche schnell auf Mittag (0,50).
surface-daytime-midnight=Stellt die Tageszeit der aktuellen Oberfläche schnell auf Mitternacht (0,00).
surface-peaceful-mode=Wendet den Friedensmodus nur auf die aktuelle Oberfläche an.
surface-no-enemies=Verhindert die Erzeugung von Gegnern nur auf der aktuellen Oberfläche.
surface-pressure=Legt die Druckeigenschaft der aktuellen Oberfläche fest.\n[color=orange]Erfordert, dass die [font=default-bold]Space Age[/font] Erweiterung installiert und aktiviert ist.[/color]
surface-magnetic-field=Legt die Magnetfeldeigenschaft der aktuellen Oberfläche fest.\n[color=orange]Erfordert, dass die [font=default-bold]Space Age[/font] Erweiterung installiert und aktiviert ist.[/color]
surface-gravity=Legt die Schwerkrafteigenschaft der aktuellen Oberfläche fest.\n[color=orange]Erfordert, dass die [font=default-bold]Space Age[/font] Erweiterung installiert und aktiviert ist.[/color]
surface-solar-power-multiplier=Legt den Solarenergiemultiplikator der aktuellen Oberfläche fest.\n[color=orange]Wertebereich: 0 bis 20.[/color]

disable-pollution=Beseitigt die gesamte vorhandene Verschmutzung und verhindert neue Verschmutzung.

remove-pollution=Entfernt sofort die gesamte Verschmutzung von der aktuellen Oberfläche.

repair-rebuild=Repariert beschädigte Entitäten und baut Geister-Entitäten und Kacheln.

hide-map=Stellt den Nebel des Krieges in bereits aufgedeckten Gebieten wieder her.

remove-decon=Entfernt alle zum Abriss markierten Entitäten.

remove-ground-items=Entfernt alle auf dem Boden liegenden Gegenstände von allen Oberflächen.

auto-clean-pollution=Beseitigt automatisch in regelmäßigen Intervallen die Verschmutzung.\n[color=orange]In Sekunden.[/color]

reveal-map=Deckt alle Gebiete innerhalb des eingestellten Radius um den Spieler auf.

remove-cliffs=Zerstört alle Klippen innerhalb des festgelegten Radius.

add-robots=Fügt deinem Inventar 50 Bauroboter und 50 Logistikroboter hinzu.\n[color=orange]Wenn die [font=default-bold]Quality[/font] Erweiterung installiert und aktiviert ist, besitzen die Roboter immer legendäre Qualität.[/color]

increase-robot-speed=Passt den Geschwindigkeitsbonus der Arbeitsroboter entsprechend dem Schieberegler an.

set-crafting-speed=Passt den Bonus für die Handwerksgeschwindigkeit Deiner Fraktion entsprechend dem Schieberegler an.

toggle-minable=Schaltet alle Entitäten zwischen abbaubar und nicht abbaubar um.

set-mining-speed=Passt den Abbaugeschwindigkeitsmultiplikator entsprechend dem Schieberegler an.

regenerate-resources=Regeneriert alle endlichen Ressourcen auf der Oberfläche und aktualisiert den Abbau.\n[color=red][font=default-bold]Auf sehr großen Karten mit vielen Entitäten kann diese Funktion das Spiel vorübergehend einfrieren. Bitte warte einen Moment – das Spiel wird anschließend normal fortgesetzt![/font][/color]

increase-resources=Setzt die Menge aller Ressourcen auf ihren Maximalwert.

generate-planet-surfaces=Erstellt Planetenoberflächen und deckt einen zentralen Bereich von 150×150 auf.\n[color=orange]Erfordert, dass die [font=default-bold]Space Age[/font] Erweiterung installiert und aktiviert ist.[/color]
teleport-to-planet=Teleportiert dich zum ausgewählten Planeten.\nWenn die Oberfläche noch nicht existiert, wird sie zuvor automatisch erzeugt.\n[color=orange]Erfordert, dass die [font=default-bold]Space Age[/font] Erweiterung installiert und aktiviert ist.[/color]
tp-open=Öffnet ein eigenes Schnellteleportfenster, das manuell gespeicherte Orte und Kartenmarkierungen der Fraktion kombiniert.\nGespeicherte Orte enthalten die Koordinaten in der Listenbezeichnung (zum Beispiel: Name (X,Y)), während beim Bearbeiten nur der benutzerdefinierte Name angezeigt wird.

recharge-energy=Lädt die Energie von Maschinen, Akkumulatoren und der persönlichen Ausrüstung wieder auf.\n[color=red][font=default-bold]Auf sehr großen Karten mit vielen Entitäten kann diese Funktion das Spiel vorübergehend einfrieren. Bitte warte einen Moment – das Spiel wird anschließend normal fortgesetzt![/font][/color]

trains-auto-mode=Schaltet alle Züge zwischen automatischem und manuellem Betrieb um.
platform-distance=Passt die Andockdistanz von Weltraumplattformen über den Schieberegler an.\n[color=orange]Erfordert, dass die [font=default-bold]Space Age[/font] Erweiterung installiert und aktiviert ist.[/color]
fill-thrusters=Befüllt alle Triebwerke der aktuellen Weltraumplattform mit dem benötigten Treibstoff und Oxidationsmittel.\n[color=orange]Erfordert, dass die [font=default-bold]Space Age[/font] Erweiterung installiert und aktiviert ist.[/color]
high_infinite_research_levels=Setzt alle unendlichen Forschungen auf Stufe 100.
add_infinite_research_levels=Fügt bei jeder Verwendung allen konfigurierten unendlichen Forschungen 100 Stufen hinzu.
instant-blueprint-building=Baut Geister-Entitäten und Kacheln direkt nach der Platzierung.\nFunktioniert mit der normalen Spielfigur (ohne Editor) und verbraucht keine Gegenstände.
instant-deconstruction=Entfernt eine Entität sofort, wenn sie zum Abriss markiert wird.\nVersucht sie zuerst abzubauen; ist dies nicht möglich, wird sie zerstört.
instant-upgrading=Führt das markierte Upgrade sofort durch.
instant-rail-planner=Baut nur vom Schienenplaner platzierte Schienengeister, wenn sofortiger Vorlagenbau AUS ist.
ghost-mode=Deaktiviert die Kollision, sodass du durch Entitäten laufen kannst. Erneut umschalten, um zum Standard zurückzukehren.
invincible-player=Deine Spielfigur ignoriert jeglichen Schaden.\n[color=orange]Erfordert eine Spielfigur. Nicht im Gott- oder Editormodus sowie vor dem Respawn verfügbar.[/color]
repair-mined-item=Repariert Entitäten unmittelbar vor dem Abbau auf volle Lebenspunkte.
instant-request=Hält bei Aktivierung Dein Inventar automatisch auf den Mindestmengen, die in den aktiven Logistikanforderungsabschnitten festgelegt sind.
instant-trash=Löscht Abfallgegenstände, anstatt Roboter zu schicken, um sie abzuholen. Praktisch, wenn das Inventar voll ist.
indestructible-builds_permanent=Macht alle Deine derzeitigen Gebäude auf allen Oberflächen dauerhaft unzerstörbar.
non-minable-permanent=Macht alle Deine derzeitigen Gebäude auf der aktuellen Oberfläche dauerhaft nicht abbaubar.

