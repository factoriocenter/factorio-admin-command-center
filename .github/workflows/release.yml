# .github/workflows/release.yml
name: Release and publish to Mod Portal

on:
  release:
    types: [published]
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag matching info.json (X.Y.Z or vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mod-portal-release
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.value }}
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Define version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v?\d+\.\d+\.\d+", tag):
              raise SystemExit("Expected an X.Y.Z or vX.Y.Z release tag.")
          tagged = subprocess.check_output(["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          info = json.loads(Path("info.json").read_text(encoding="utf-8"))
          if tagged != head or tag.removeprefix("v") != info["version"]:
              raise SystemExit("The checkout and info.json must match the release tag.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"value={tag}\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Factorio 2.1 and 2.0 packages
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import subprocess
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          root = Path.cwd()
          output = root / "dist"
          output.mkdir(exist_ok=True)
          excluded = {".git", ".github", "dist", "tools", "tests", "compatibility", "__pycache__"}
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          for target in ("2.0", "2.1"):
              info = json.loads((root / "info.json").read_text(encoding="utf-8"))
              if info["factorio_version"] != target:
                  info.update(json.loads((root / "compatibility" / f"{target}.json").read_text(encoding="utf-8")))
              assert info["factorio_version"] == target
              folder = f"{info['name']}_{info['version']}"
              archive_path = output / f"{folder}.zip"
              with ZipFile(archive_path, "w", ZIP_DEFLATED) as archive:
                  def write_file(name, content):
                      entry = ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                      entry.compress_type = ZIP_DEFLATED
                      entry.create_system = 3
                      entry.external_attr = 0o100644 << 16
                      archive.writestr(entry, content)

                  for filename in sorted(filter(None, tracked)):
                      relative = Path(filename)
                      path = root / relative
                      if not path.is_file() or any(part in excluded for part in relative.parts):
                          continue
                      if path.suffix in {".ps1", ".sh", ".xcf", ".py", ".pyc", ".zip"} or any(part.startswith(".") for part in relative.parts):
                          continue
                      if relative.as_posix() == "info.json":
                          write_file(f"{folder}/info.json", json.dumps(info, indent=2, ensure_ascii=False) + "\n")
                      elif relative.as_posix() == "changelog.txt":
                          version = tuple(map(int, info["version"].split(".")))
                          blocks = re.split(r"(?m)^-{20,}\s*\n", path.read_text(encoding="utf-8"))
                          included = []
                          for block in blocks:
                              match = re.search(r"(?m)^Version: (\d+)\.(\d+)\.(\d+)", block)
                              if match and tuple(map(int, match.groups())) <= version:
                                  included.append("-" * 99 + "\n" + block)
                          write_file(f"{folder}/changelog.txt", "".join(included))
                      else:
                          write_file(f"{folder}/{relative.as_posix()}", path.read_bytes())
              with ZipFile(archive_path) as archive:
                  assert archive.testzip() is None
                  assert json.loads(archive.read(f"{folder}/info.json")) == info
              print(f"Factorio {target}: {archive_path}")
          PY

      - name: Store release packages
        uses: actions/upload-artifact@v4
        with:
          name: mod-packages-${{ steps.version.outputs.value }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip --clobber

  publish:
    needs: build-and-upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download the exact release packages
        uses: actions/download-artifact@v4
        with:
          name: mod-packages-${{ needs.build-and-upload.outputs.tag }}
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish both Factorio versions to Mod Portal
        env:
          MOD_PORTAL_API_KEY: ${{ secrets.MOD_PORTAL_API_KEY }}
          EXPECTED_MOD_NAME: factorio-admin-command-center
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import uuid
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urlsplit
          from urllib.request import Request, urlopen
          from zipfile import ZipFile

          # https://wiki.factorio.com/Mod_upload_API
          portal = "https://mods.factorio.com"
          key = os.environ.get("MOD_PORTAL_API_KEY", "")
          if not key:
              raise SystemExit("Add the MOD_PORTAL_API_KEY Actions secret with ModPortal: Upload Mods permission.")
          expected = os.environ["EXPECTED_MOD_NAME"]

          def request_json(url, data=None, headers=None):
              try:
                  with urlopen(Request(url, data=data, headers=headers or {}), timeout=120) as response:
                      result = json.load(response)
              except HTTPError as error:
                  # Never print credentials, signed upload URLs, or server bodies.
                  raise SystemExit(f"Mod Portal returned HTTP {error.code}. Check permissions and package metadata.") from None
              except (URLError, TimeoutError, ValueError):
                  raise SystemExit("Mod Portal request failed. Rerun the workflow to check and retry.") from None
              if not isinstance(result, dict) or result.get("error"):
                  raise SystemExit("Mod Portal rejected the request. Check the key, permissions, and package metadata.")
              return result

          def multipart(name, content, filename=None):
              boundary = uuid.uuid4().hex
              disposition = f'Content-Disposition: form-data; name="{name}"'
              if filename:
                  disposition += f'; filename="{filename}"'
              prefix = f"--{boundary}\r\n{disposition}\r\n"
              if filename:
                  prefix += "Content-Type: application/zip\r\n"
              body = (prefix + "\r\n").encode() + content + f"\r\n--{boundary}--\r\n".encode()
              return body, {"Content-Type": f"multipart/form-data; boundary={boundary}"}

          packages = []
          for path in sorted(Path("dist").glob("*.zip")):
              with ZipFile(path) as archive:
                  infos = [name for name in archive.namelist() if name.count("/") == 1 and name.endswith("/info.json")]
                  if len(infos) != 1 or archive.testzip() is not None:
                      raise SystemExit("Invalid release archive.")
                  info = json.loads(archive.read(infos[0]))
              if info["name"] != expected or path.name != f"{expected}_{info['version']}.zip":
                  raise SystemExit("Unexpected mod name or package filename.")
              packages.append((info, path, hashlib.sha1(path.read_bytes()).hexdigest()))
          if len(packages) != 2 or {info["factorio_version"] for info, _, _ in packages} != {"2.0", "2.1"}:
              raise SystemExit("Expected exactly one package for each Factorio version, 2.0 and 2.1.")
          if len({info["version"] for info, _, _ in packages}) != 2:
              raise SystemExit("The packages must have distinct mod versions.")

          # Check both versions before uploading either; never replace published content.
          releases = request_json(f"{portal}/api/mods/{quote(expected, safe='')}")["releases"]
          pending = []
          for info, path, checksum in packages:
              existing = next((release for release in releases if release["version"] == info["version"]), None)
              if existing:
                  if existing.get("sha1") != checksum or existing.get("info_json", {}).get("factorio_version") != info["factorio_version"]:
                      raise SystemExit(f"Version {info['version']} already exists with different content. Bump its manifest version.")
                  print(f"Already published: {path.name} (checksum verified)")
              else:
                  pending.append((info, path))

          for info, path in sorted(pending, key=lambda item: item[0]["factorio_version"]):
              body, headers = multipart("mod", expected.encode())
              headers["Authorization"] = f"Bearer {key}"
              result = request_json(f"{portal}/api/v2/mods/releases/init_upload", body, headers)
              upload_url = result.get("upload_url", "")
              parsed = urlsplit(upload_url)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit("Mod Portal returned an invalid upload URL.")
              # The signed URL is a credential. Do not print it or forward the API key.
              body, headers = multipart("file", path.read_bytes(), path.name)
              result = request_json(upload_url, body, headers)
              if result.get("success") is not True:
                  raise SystemExit("Upload not confirmed. Rerun the workflow to check its status.")
              print(f"Published: {path.name} (Factorio {info['factorio_version']})")
          PY
